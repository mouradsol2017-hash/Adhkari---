name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: |
          chmod +x ./gradlew
          ls -la   # للتأكد من وجود الملفات

      - name: Check project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo "=== Looking for gradlew ==="
          find . -name "gradlew" -type f
          echo "=== Looking for settings.gradle* ==="
          find . -name "settings.gradle*" -type f

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
